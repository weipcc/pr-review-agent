<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" font-family="Helvetica, Arial, sans-serif" font-size="14">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker></defs>
<rect width="760" height="300" fill="#ffffff"/>
<g stroke="#475569" stroke-width="1.5" fill="none" marker-end="url(#a)">
<path d="M250 100H300"/><path d="M500 100H550"/>
<path d="M620 140V190Q620 205 605 205H175Q160 205 160 190V140"/>
