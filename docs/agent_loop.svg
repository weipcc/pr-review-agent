<g text-anchor="middle" fill="#0f172a">
<rect x="40" y="60" width="210" height="80" rx="8" fill="#ede9fe" stroke="#6d28d9"/><text x="145" y="92" font-weight="bold">Gemini</text><text x="145" y="112" font-size="12">told "Step k of 10"</text><text x="145" y="128" font-size="12">decides what to inspect</text>
