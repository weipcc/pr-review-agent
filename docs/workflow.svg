<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 800" width="760" height="800" font-family="Helvetica, Arial, sans-serif" font-size="14">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker></defs>
<rect width="760" height="800" fill="#ffffff"/>
<g stroke="#475569" stroke-width="1.5" fill="none" marker-end="url(#a)">
<path d="M200 76V105Q200 120 215 120H300"/><path d="M560 76V105Q560 120 545 120H460"/>
<path d="M380 180V225"/>
<path d="M230 265H170V340"/><path d="M530 265H590V340"/>
<path d="M170 410V425H380V450"/><path d="M590 410V425H380"/>
<path d="M380 530V565"/><path d="M380 625V655"/><path d="M380 705V735"/>
<path d="M530 490H575" stroke="#6d28d9" stroke-dasharray="5 4"/>
</g>
<g text-anchor="middle" fill="#0f172a">
<rect x="70" y="20" width="260" height="56" rx="8" fill="#e0f2fe" stroke="#0369a1"/><text x="200" y="43" font-weight="bold">Web page / HTTP API</text><text x="200" y="62" font-size="12">review_page.html → POST /review</text>
<rect x="430" y="20" width="260" height="56" rx="8" fill="#e0f2fe" stroke="#0369a1"/><text x="560" y="43" font-weight="bold">@mention poller</text><text x="560" y="62" font-size="12">polls GitHub notifications every 15 s</text>
<rect x="200" y="120" width="360" height="60" rx="8" fill="#f1f5f9" stroke="#475569"/><text x="380" y="143" font-weight="bold">Fetch via the GitHub API</text><text x="380" y="163" font-size="12">diff · changed files (full / excerpt) · PR title/description · README excerpt</text>
<polygon points="380,225 530,265 380,305 230,265" fill="#fef3c7" stroke="#b45309"/><text x="380" y="259" font-weight="bold">Size check</text><text x="380" y="277" font-size="11">diff + context &lt; 6,000 tokens?</text>
<text x="205" y="257" font-size="12" fill="#166534">yes</text><text x="555" y="257" font-size="12" fill="#b45309">no</text>
<rect x="40" y="340" width="260" height="70" rx="8" fill="#dcfce7" stroke="#166534"/><text x="170" y="367" font-weight="bold">Batch mode</text><text x="170" y="387" font-size="12">all files in one prompt</text><text x="170" y="402" font-size="11">(cross-file context)</text>
<rect x="460" y="340" width="260" height="70" rx="8" fill="#fee2e2" stroke="#b91c1c"/><text x="590" y="367" font-weight="bold">Per-file mode</text><text x="590" y="387" font-size="12">one call per file, sequential</text><text x="590" y="402" font-size="11">other files' diffs included as context</text>
<rect x="230" y="450" width="300" height="80" rx="8" fill="#ede9fe" stroke="#6d28d9"/><text x="380" y="478" font-weight="bold">Gemini</text><text x="380" y="498" font-size="12">structured output (fixed JSON schema)</text><text x="380" y="515" font-size="11">category · confidence · evidence · lines · suggestion</text>
<rect x="575" y="450" width="165" height="80" rx="8" fill="#ffffff" stroke="#6d28d9" stroke-dasharray="5 4"/><text x="657" y="474" font-weight="bold" font-size="13">V3 extension</text><text x="657" y="494" font-size="11">agent reads the repo</text><text x="657" y="510" font-size="11">in an E2B sandbox</text>
<rect x="200" y="565" width="360" height="60" rx="8" fill="#f1f5f9" stroke="#475569"/><text x="380" y="590" font-weight="bold">Aggregate and sort</text><text x="380" y="610" font-size="12">per-file results → overall recommendation</text>
<rect x="200" y="655" width="360" height="50" rx="8" fill="#f1f5f9" stroke="#475569"/><text x="380" y="685" font-weight="bold">Render Markdown report</text>
<rect x="200" y="735" width="360" height="50" rx="8" fill="#e0f2fe" stroke="#0369a1"/><text x="380" y="758" font-weight="bold">Output</text><text x="380" y="775" font-size="12">web page · API response · PR comment</text>
</g>
</svg>
