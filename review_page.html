<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>PR Review Agent</title>
<style>
  body {
    font-family: -apple-system, "Helvetica Neue", Arial, sans-serif;
    max-width: 800px;
    margin: 40px auto;
    padding: 0 20px;
    color: #1a1a1a;
  }
  h1 {
    font-size: 20px;
  }
  input[type="text"] {
    width: 100%;
    padding: 10px;
    font-size: 14px;
    box-sizing: border-box;
    border: 1px solid #ccc;
    border-radius: 6px;
  }
  button {
    margin-top: 10px;
    padding: 10px 20px;
    font-size: 14px;
    background: #2563eb;
    color: white;
    border: none;
    border-radius: 6px;
    cursor: pointer;
  }
  button:disabled {
    background: #9ca3af;
    cursor: not-allowed;
  }
  pre {
    white-space: pre-wrap;
    background: #f5f5f5;
    padding: 20px;
    border-radius: 8px;
    line-height: 1.6;
    margin-top: 20px;
  }
  .error {
    color: #dc2626;
  }
</style>
</head>
<body>
  <h1>PR Review Agent</h1>
  <p>Paste a GitHub PR URL and click the button to start a review:</p>
  <input type="text" id="prUrl" placeholder="https://github.com/owner/repo/pull/1" />
  <br />
  <button id="reviewBtn" onclick="runReview()">Start review</button>
  <div id="result"></div>

  <script>
    async function runReview() {
      const prUrl = document.getElementById("prUrl").value.trim();
      const resultDiv = document.getElementById("result");
      const button = document.getElementById("reviewBtn");

      if (!prUrl) {
        resultDiv.innerHTML = "<p class='error'>Please enter a PR URL first.</p>";
        return;
      }

      button.disabled = true;
      button.textContent = "Reviewing...";
      resultDiv.innerHTML = "<p>Reviewing, please wait...</p>";

      try {
        const res = await fetch("http://localhost:8000/review", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ pr_url: prUrl }),
        });

        if (!res.ok) {
          const err = await res.json();
          throw new Error(err.detail || "API returned an error");
        }

        const data = await res.json();
        const report = data.markdown_report || JSON.stringify(data, null, 2);
        const escaped = report
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;");
        resultDiv.innerHTML = "<pre>" + escaped + "</pre>";
      } catch (err) {
        resultDiv.innerHTML =
          "<p class='error'>Request failed: " + err.message + "</p>" +
          "<p>Please make sure the local uvicorn server is running (http://localhost:8000).</p>";
      } finally {
        button.disabled = false;
        button.textContent = "Start review";
      }
    }
  </script>
</body>
</html>
